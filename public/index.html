<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tareas</title>
  <meta name="description" content="Tareas de casa para dos: qué toca hoy, quién lo hace y reparto justo.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tareas">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" aria-label="Secciones">
    <button data-tab="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg><span>Hoy</span><b class="badge" id="badge-hoy" hidden></b></button>
    <button data-tab="semana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semana</span></button>
    <button data-tab="tareas"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/></svg><span>Tareas</span></button>
    <button data-tab="reparto"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.8 14.1A5 5 0 0 1 21 19"/></svg><span>Reparto</span></button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>

  <div id="toast" class="toast" role="status" hidden><span id="toast-msg"></span><button id="toast-btn" hidden></button></div>

  <template id="login-tpl">
    <div class="login">
      <div class="login-card">
        <img src="/icons/icon-192.png" alt="" width="72" height="72">
        <h1>Tareas</h1>
        <p class="muted">Introduce la contraseña de casa</p>
        <form id="login-form">
          <input type="password" name="password" autocomplete="current-password" placeholder="Contraseña" required>
          <button class="btn primary block" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
