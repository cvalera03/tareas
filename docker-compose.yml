# Uso por SSH (en ZimaOS o en cualquier servidor con Docker):
#   APP_PASSWORD=tu-contraseña docker compose up -d --build
# Para instalarla desde la interfaz de ZimaOS usa zimaos/tareas.yml.
services:
  tareas:
    build: .
    image: tareas:latest
    container_name: tareas
    restart: unless-stopped
    ports:
      - "8421:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Define APP_PASSWORD (contraseña compartida)}
      TZ: Europe/Madrid
    volumes:
      - ${DATA_PATH:-/DATA/AppData/tareas}:/data
